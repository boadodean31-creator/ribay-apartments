<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Ribay Apartments">
  <defs>
    <linearGradient id="rb-bg" x1="6" y1="0" x2="34" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10936B"/>
      <stop offset="1" stop-color="#054A38"/>
    </linearGradient>
    <linearGradient id="rb-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD25A"/>
      <stop offset="1" stop-color="#F4902A"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="11" fill="url(#rb-bg)"/>
  <rect x=".5" y=".5" width="39" height="39" rx="10.5" fill="none" stroke="#fff" stroke-opacity=".12"/>

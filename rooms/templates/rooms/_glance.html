      <section class="rd-card rd-glance {{ extra_class }}" aria-label="Why rent this room">
        <h2 class="rd-ct">Why rent this room</h2>
        <dl class="rd-gl">
          <div><span class="gl-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3 8.3-7 10-4-1.7-7-5.4-7-10V6z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/></svg></span><dt>Included in the rent</dt><dd>{% for a in room_amenities|slice:":3" %}{{ a.title }}{% if not forloop.last %}, {% endif %}{% endfor %}</dd></div>
          <div><span class="gl-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15l2 2 4-4"/></svg></span><dt>Booking</dt><dd>Free viewing, no obligation</dd></div>
          <div><span class="gl-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><dt>Viewing hours</dt><dd data-c="hours">{{ viewing_hours }}</dd></div>
          <div><span class="gl-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg></span><dt>Replies</dt><dd data-c="reply">{{ contact_reply }}</dd></div>
        </dl>
      </section>
